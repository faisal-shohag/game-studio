[preset.0]

name="Android"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, assets/brand/makensis_logo.png"
export_path="build/game-studio.apk"

[preset.0.options]

gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=true
package/unique_name="com.gamestudio.app"
package/name="Game Studio"
screen/immersive_mode=true
permissions/internet=true
permissions/access_network_state=true
permissions/access_wifi_state=true
permissions/vibrate=true
permissions/camera=true
launcher_icons/main_192x192="res://assets/brand/icon_192.png"
launcher_icons/adaptive_foreground_432x432="res://assets/brand/icon_foreground.png"
launcher_icons/adaptive_background_432x432="res://assets/brand/icon_background.png"
screen/background_color=Color(0.9647, 0.9647, 0.9843, 1)
screen/branding_image="res://assets/brand/branding.png"
